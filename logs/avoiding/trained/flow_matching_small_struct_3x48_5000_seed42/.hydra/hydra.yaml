hydra:
  run:
    dir: logs/avoiding/trained/flow_matching_small_struct_3x48_5000_seed42
  sweep:
    dir: ${log_dir}/sweeps/${agent_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=logs/avoiding/trained/flow_matching_small_struct_3x48_5000_seed42
    task:
    - agents=flow_matching_transformer_agent
    - agent_name=flow_matching_small_struct_3x48_5000
    - window_size=5
    - n_layer=3
    - n_embd=48
    - n_head=3
    - epoch=5000
    - eval_every_n_epochs=50
    - train_batch_size=256
    - val_batch_size=256
    - num_workers=4
    - train_only=True
  job:
    name: run
    override_dirname: agent_name=flow_matching_small_struct_3x48_5000,agents=flow_matching_transformer_agent,epoch=5000,eval_every_n_epochs=50,n_embd=48,n_head=3,n_layer=3,num_workers=4,train_batch_size=256,train_only=True,val_batch_size=256,window_size=5
    id: ???
    num: ???
    config_name: avoiding_config.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.1.1
    cwd: /ocean/projects/ccr200024p/qzhou7/projects/d3il
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /ocean/projects/ccr200024p/qzhou7/projects/d3il/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    choices:
      agents: flow_matching_transformer_agent
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
