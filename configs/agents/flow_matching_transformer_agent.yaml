_target_: agents.flow_matching_agent.FlowMatchingAgent
_recursive_: false

model:
  _target_: agents.models.flow_matching.flow_matching.FlowMatching
  _recursive_: false
  state_dim: ${obs_dim}
  action_dim: ${action_dim}
  device: ${device}
  solver_steps: 16
  solver: heun
  time_scale: 100.0
  model:
    _target_: agents.models.diffusion.diffusion_models.DiffusionTransformerNetwork
    state_dim: ${obs_dim}
    action_dim: ${action_dim}
    goal_conditioned: false
    goal_seq_len: 10
    obs_seq_len: ${window_size}
    embed_pdrob: 0
    goal_drop: 0
    attn_pdrop: 0.2
    resid_pdrop: 0.1
    embed_dim: ${n_embd}
    n_layers: ${n_layer}
    n_heads: ${n_head}
    device: ${device}
    linear_output: true

optimization:
  _target_: torch.optim.Adam
  lr: 5e-4
  weight_decay: 0

lr_scheduler: null
trainset: ${trainset}
valset: ${valset}
train_batch_size: ${train_batch_size}
val_batch_size: ${val_batch_size}
num_workers: ${num_workers}
epoch: ${epoch}
device: ${device}
scale_data: ${scale_data}
eval_every_n_epochs: ${eval_every_n_epochs}
discount: 0.99
use_ema: true
decay: 0.995
update_ema_every_n_steps: 1
goal_window_size: 1
window_size: ${window_size}
diffusion_kde: false
diffusion_kde_samples: 100
goal_conditioned: false
